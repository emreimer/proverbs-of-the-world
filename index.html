<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Proverbs"/>
<meta name="theme-color" content="#000"/>
<title>Proverbs of the World</title>
<style>
:root{--ink:#f4efe6;--muted:#9eb0c4;--gold:#e6c56a;--good:#43d39a;--bad:#ef6673;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--ink)}
body{font-family:Georgia,Palatino,serif;padding:max(8px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto}
header{text-align:center;padding:4px 2px 6px}
.brand{font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.stats{margin-top:6px;font-family:-apple-system,sans-serif;font-size:16px;color:var(--muted)}
.stats b{color:#fff}
.space{height:min(34vh,270px);margin:0 -12px 2px;background:#000}
#globe{width:100%;height:min(34vh,270px);display:block}
.stage{border:1px solid var(--line);border-radius:22px;padding:12px}
.country-row{display:flex;align-items:center;gap:10px;cursor:pointer}
.flag{width:58px;height:38px;object-fit:cover;border-radius:6px}
.cname{margin:0;font-size:26px}
.info-btn{margin-left:auto;border:1px solid var(--line);background:#151b24;color:#fff;border-radius:999px;padding:8px 12px;font-size:14px;font-family:-apple-system,sans-serif;white-space:nowrap}
.hint{color:var(--muted);font-size:16px;font-family:-apple-system,sans-serif}
h2.q{font-size:19px;line-height:1.35;margin:12px 0;font-family:-apple-system,sans-serif;font-weight:700}
.opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;color:#fff;background:#0e1622;border:1px solid var(--line);border-radius:16px;padding:16px 14px;font:inherit;font-size:19px;line-height:1.45}
.meta{display:none;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.revealed .meta{display:flex}
.opt.correct{border-color:var(--good)}
.opt.wrong{border-color:var(--bad)}
.btn{width:100%;border:0;border-radius:999px;padding:16px;font-size:18px;font-weight:800;background:var(--gold);margin-top:12px}
.page{display:none;position:fixed;inset:0;z-index:20;background:#000;padding:20px;overflow:auto}
.page.open{display:block}
.page-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.page-head{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.page-head h1{margin:0;font-size:26px;line-height:1.15}
.page-map{width:100%;height:230px;border:0;border-radius:14px;margin:8px 0 14px;background:#000;display:block}
.fact{background:#0e1622;border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;font-size:20px}
.fact span{display:block;font-size:14px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.hidden{display:none!important}
.back{border:1px solid var(--line);background:transparent;color:#fff;border-radius:999px;padding:10px 16px;font-size:17px;flex:none}
#result{font-size:17px;min-height:24px}
</style></head>
<body>
<div class="page" id="page">
<div class="page-top">
<div class="page-head">
<img id="pageFlag" class="flag" alt=""/>
<h1 id="pageName"></h1>
</div>
<button class="back" id="backBtn">Back</button>
</div>
<canvas id="pageGlobe" class="page-map" width="640" height="360"></canvas>
<div class="fact"><span>Population</span><b id="pagePop"></b></div>
<div class="fact"><span>Official language</span><b id="pageLang"></b></div>
<div class="fact"><span>Capital</span><b id="pageCap"></b></div>
</div>
<div class="wrap">
<header><div class="brand">Proverbs of the World</div><div class="stats">Score <b id="score">0</b> · Streak <b id="streak">0</b></div></header>
<div class="space"><canvas id="globe" width="720" height="640"></canvas></div>
<div class="stage">
<div class="country-row" id="countryRow">
<img id="flag" class="flag hidden"/>
<h1 id="country" class="cname">Proverbs Quiz</h1>
<button type="button" class="info-btn hidden" id="infoBtn">Country Info</button>
</div>
<p id="hint" class="hint">Spin to land on a country</p>
<h2 id="q" class="q hidden">Which of these four proverbs is from this country?</h2>
<div id="opts" class="opts"></div>
<p id="result"></p>
<button class="btn" id="spinBtn">Spin the world</button>
</div></div>
<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
<script src="game.js"></script>
</body></html>
