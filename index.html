<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Proverbs" />
<meta name="theme-color" content="#000000" />
<title>Proverbs of the World</title>
<style>
  :root { --ink:#f4efe6; --muted:#9eb0c4; --gold:#e6c56a; --good:#43d39a; --bad:#ef6673; --line:rgba(255,255,255,.1); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#000; color:var(--ink); }
  body { font-family: Georgia, Palatino, serif; background:#000; padding: max(8px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  .wrap { max-width:480px; margin:0 auto; }
  header { text-align:center; padding:4px 2px 6px; }
  .brand { color:#f4f0e6; font-size:13px; letter-spacing:.18em; text-transform:uppercase; }
  .stats { margin-top:4px; font-family:-apple-system,sans-serif; font-size:13px; color:var(--muted); }
  .stats b { color:#fff; }
  .space { height:min(42vh,340px); margin:0 -12px 2px; background:#000; }
  #globe { width:100%; height:min(42vh,340px); display:block; }
  .stage { border:1px solid var(--line); border-radius:22px; padding:12px; }
  .country-row { display:flex; align-items:center; gap:12px; cursor:pointer; }
  .flag { width:52px; height:34px; object-fit:cover; border-radius:6px; }
  .cname { margin:0; font-size:22px; }
  .hint { color:var(--muted); font-size:13px; font-family:-apple-system,sans-serif; }
  h2.q { font-size:12px; margin:8px 0; font-family:-apple-system,sans-serif; }
  .opts { display:grid; gap:7px; }
  .opt { width:100%; text-align:left; color:var(--ink); background:#0e1622; border:1px solid var(--line); border-radius:14px; padding:10px 12px; font:inherit; }
  .meta { display:none; align-items:center; gap:8px; margin-top:8px; font-size:12px; }
  .revealed .meta { display:flex; }
  .opt.correct { border-color:var(--good); }
  .opt.wrong { border-color:var(--bad); }
  .btn { width:100%; border:0; border-radius:999px; padding:13px; font-weight:800; background:var(--gold); margin-top:12px; }
  .page { display:none; position:fixed; inset:0; z-index:20; background:#000; padding:20px; }
  .page.open { display:block; }
  .hidden { display:none !important; }
</style></head>
<body>
<div class="page" id="page"><button id="backBtn">Back</button><img id="pageFlag"/><h1 id="pageName"></h1><div id="pagePop"></div><div id="pageLang"></div><div id="pageCap"></div></div>
<div class="wrap">
<header><div class="brand">Proverbs of the World</div><div class="stats">Score <b id="score">0</b> · Streak <b id="streak">0</b></div></header>
<div class="space"><canvas id="globe" width="720" height="640"></canvas></div>
<div class="stage">
<div class="country-row"><img id="flag" class="flag hidden"/><h1 id="country" class="cname">Proverbs Quiz</h1></div>
<p id="hint" class="hint">Spin to land on a country</p>
<h2 id="q" class="q hidden">Which of these four proverbs is from this country?</h2>
<div id="opts" class="opts"></div>
<p class="result" id="result"></p>
<button class="btn" id="spinBtn">Spin the world</button>
</div></div>
<script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
<script src="game.js"></script>
</body></html>
